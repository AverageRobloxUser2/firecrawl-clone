[project]
name = "firecrawl-clone"
version = "0.1.0"
description = "Local browser automation for AI agents — scrape, click, markdownify"
requires-python = ">=3.12"
dependencies = [
    "nodriver",
    "beautifulsoup4",
    "markdownify",
    "lxml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiohttp",
]

[project.scripts]
firecrawl = "firecrawl_clone.cli:main"
firecrawl-stdio = "firecrawl_clone.__main__:main"
firecrawl-api = "firecrawl_clone.server:run_server"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.setuptools.packages.find]
where = ["src"]
